<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ResolVR - Elite Tech Talent & Scalable Software Solutions</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ResolVR - Elite tech talent &amp; scalable software solutions for businesses. Your partner in offshore IT success specializing in product development, team augmentation, and IoT solutions.">
  <meta name="keywords" content="tech talent, IT solutions, software development, offshore IT, product development, team augmentation, IoT solutions, angular development">
  <meta name="author" content="ResolVR">
  <meta name="robots" content="index, follow">
  
  <!-- Performance optimizations - only preload critical images -->
  <link rel="preload" href="assets/resolvr-logo.webp" as="image" type="image/webp">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://resolvr.dev/">
  <meta property="og:title" content="ResolVR - Elite Tech Talent &amp; Scalable Solutions">
  <meta property="og:description" content="Your partner in offshore IT success specializing in product development, team augmentation, and IoT solutions.">
  <meta property="og:image" content="https://resolvr.dev/assets/resolvr-logo.webp">
  <meta property="og:site_name" content="ResolVR">
  <meta property="og:locale" content="en_US">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://resolvr.dev/">
  <meta property="twitter:title" content="ResolVR - Elite Tech Talent &amp; Scalable Solutions">
  <meta property="twitter:description" content="Your partner in offshore IT success specializing in product development, team augmentation, and IoT solutions.">
  <meta property="twitter:image" content="https://resolvr.dev/assets/resolvr-logo.webp">
  
  <!-- Canonical URL -->
  <link rel="canonical" href="https://resolvr.dev/">
  
  <!-- Basic favicon only for development, PWA features will be enabled in production -->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

  <!-- Security headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://www.google-analytics.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://www.google-analytics.com;">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()">
  
  <!-- Google tag (gtag.js) -->
  <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-0KW06HHF5N"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-0KW06HHF5N');
  </script>

  <!-- Conditionally load PWA components in production only -->
  <script>
    // Only add PWA features in production
    if (window.location.hostname !== 'localhost' && !window.location.hostname.includes('127.0.0.1')) {
      console.log('Enabling service worker for production');
      // Add manifest
      const manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = 'manifest.webmanifest';
      document.head.appendChild(manifestLink);
      
      // Add Apple PWA meta tags
      const metaTags = [
        { name: 'theme-color', content: '#0066cc' },
        { name: 'application-name', content: 'ResolVR' },
        { name: 'apple-mobile-web-app-capable', content: 'yes' },
        { name: 'mobile-web-app-capable', content: 'yes' },
        { name: 'apple-mobile-web-app-status-bar-style', content: 'black-translucent' },
        { name: 'apple-mobile-web-app-title', content: 'ResolVR' }
      ];
      
      metaTags.forEach(tagInfo => {
        const tag = document.createElement('meta');
        tag.name = tagInfo.name;
        tag.content = tagInfo.content;
        document.head.appendChild(tag);
      });
      
      // Add additional icon links for production
      const iconLinks = [
        { rel: 'icon', type: 'image/png', sizes: '192x192', href: './assets/icons/icon-192x192.png' },
        { rel: 'icon', type: 'image/png', sizes: '512x512', href: './assets/icons/icon-512x512.png' },
        { rel: 'apple-touch-icon', href: './assets/icons/icon-192x192.png' },
        { rel: 'mask-icon', href: './assets/icons/safari-pinned-tab.svg', color: '#5bbad5' }
      ];
      
      iconLinks.forEach(linkInfo => {
        const link = document.createElement('link');
        link.rel = linkInfo.rel;
        if (linkInfo.type) link.type = linkInfo.type;
        if (linkInfo.sizes) link.sizes = linkInfo.sizes;
        link.href = linkInfo.href;
        if (linkInfo.color) link.setAttribute('color', linkInfo.color);
        document.head.appendChild(link);
      });
      
      // Add error handling for service worker loading
      window.addEventListener('load', () => {
        if ('serviceWorker' in navigator) {
          // Check for service worker ngsw-worker.js file before trying to register
          fetch('ngsw-worker.js', { method: 'HEAD' })
            .then(response => {
              if (response.ok) {
                console.log('Service worker file exists, proceeding with registration');
                // Let Angular's built-in service worker registration handle the rest
              } else {
                console.warn('Service worker file not found, PWA features disabled');
              }
            })
            .catch(error => {
              console.error('Error checking for service worker file:', error);
            });
        }
      });
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
