[[redirects]]
# Special redirect for service worker files
from = "/ngsw-worker.js"
to = "/ngsw-worker.js"
status = 200

[[redirects]]
# Special redirect for service worker configuration
from = "/ngsw.json"
to = "/ngsw.json"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
# Specific header for service worker files - more restrictive caching
for = "/ngsw*"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"
  Content-Type = "application/javascript"

[[headers]]
for = "/*.css"
  [headers.values]
  Content-Type = "text/css"
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.js"
  [headers.values]
  Content-Type = "text/javascript"
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[build.processing]
skip_processing = false
[build.processing.css]
bundle = true
minify = true
[build.processing.js]
bundle = true
minify = true
[build.processing.html]
pretty_urls = true
[build.processing.images]
compress = true